name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only by default; nothing here writes to the repository
permissions:
  contents: read

# a newer push supersedes an in-flight run of the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,pandas]"
      - run: ruff check src tests docs/examples
      - run: mypy
      - run: pytest -q

  # the large differential sweeps against the archived engine
  sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,pandas]"
      - run: pytest -q -m slow
