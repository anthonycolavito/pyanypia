[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyanypia"
version = "0.3.1"
description = "Vectorized Social Security benefit-formula functions, penny-exact with SSA's AnyPIA (2026 TR)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Colavito", email = "colavitoanthony@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["social-security", "ssa", "anypia", "pia", "aime", "microsimulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    # every version here is in the CI matrix; do not add one that is not
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/anthonycolavito/pyanypia"
Repository = "https://github.com/anthonycolavito/pyanypia"
Issues = "https://github.com/anthonycolavito/pyanypia/issues"
Changelog = "https://github.com/anthonycolavito/pyanypia/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
# anypia-engine is the archived full calculator, used as the test oracle
dev = [
    "pytest>=8",
    "ruff==0.16.*",
    "mypy==2.3.*",
    "anypia-engine @ git+https://github.com/anthonycolavito/anypia-engine@v0.2.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pyanypia"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: large differential sweeps (run with -m slow)"]

[tool.mypy]
strict = true
files = ["src/pyanypia"]

# pandas is an optional extra, so its stubs are not a build requirement
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true
