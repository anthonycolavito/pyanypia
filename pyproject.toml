[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyanypia"
version = "0.1.0.dev0"
description = "Pure-Python port of SSA's AnyPIA Detailed Calculator (2026 TR), penny-exact vs the C++ oracle"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anthony Colavito", email = "colavitoanthony@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/anthonycolavito/pyanypia"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyanypia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: differential tests requiring the compiled C++ oracle goldens",
    "oracle_smoke: fast oracle differential subset for CI",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pyanypia"]
